services:
  mongodb:
    image: mongo:7
    container_name: zest-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - zest-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zest-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zest-pasticceria
      - NEXT_PUBLIC_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - zest-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

networks:
  zest-network:
    driver: bridge

volumes:
  mongodb_data:
